server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The production bundle is intentionally client-heavy. Compress textual
  # assets at the edge so Railway does not stream an 800+ KB JavaScript file
  # uncompressed to every browser and deployment probe.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|json|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
