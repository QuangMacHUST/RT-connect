[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "rt-connect-api"
version = "0.1.0"
description = "RT-CONNECT backend API"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "alembic==1.19.2",
  "fastapi==0.141.1",
  "minio==7.2.20",
  "numpy==2.5.3",
  "psycopg[binary]==3.3.3",
  "pydicom==3.0.2",
  "PyJWT[crypto]==2.13.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "structlog==25.5.0",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rt_connect_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --cov=rt_connect_api --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["rt_connect_api"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
warn_unused_configs = true
