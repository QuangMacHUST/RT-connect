name: rt-connect-local

services:
  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0-dev
      SCHEMA_REVISION: 20260908_0015
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://rt_connect:rt_connect@postgres:5432/rt_connect
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: rt-connect-artifacts
      S3_ACCESS_KEY_ID: local-development-only
      S3_SECRET_ACCESS_KEY: local-development-only
      S3_SIGNED_URL_TTL_SECONDS: 900
      GAMMA_QUEUE_VISIBILITY_TIMEOUT_SECONDS: 120
      GAMMA_LEASE_SECONDS: 120
      GAMMA_RETRY_MAX_ATTEMPTS: 3
      GAMMA_RETRY_BACKOFF_BASE_SECONDS: 5
      GAMMA_RETRY_BACKOFF_MAX_SECONDS: 300
      GAMMA_EXECUTION_DEADLINE_SECONDS: 900
      GAMMA_MAX_VOXELS: 2000000
      GAMMA_MAX_CANDIDATE_EVALUATIONS: 50000000
      # Pydantic Settings parses collection values from JSON in environment variables.
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: rt_connect
      POSTGRES_USER: rt_connect
      POSTGRES_PASSWORD: rt_connect
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rt_connect -d rt_connect"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-development-only
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
